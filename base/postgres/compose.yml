services:
  database:
    build: ./
    container_name: ${DB_NAME}
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      db:
    # ports:
      # - 5432:5432
    volumes:
      - ./data/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD_ROOT}
      POSTGRES_USER: root
    env_file: ../../.env
    profiles:
      - base

