services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./data/:/data/
      - ./config/services/:/etc/caddy/
      - ./config/config/:/config/
    networks:
      - edge
    profiles:
      - base

