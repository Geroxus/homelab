services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # exposed s.t. I can inspect this via tools
      - 6379:6379
    networks:
      - edge
    profiles:
      - base

