services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME_AFFINE}:${DB_PASSWORD_AFFINE}@${DB_NAME}:5432/affine
      - AFFINE_INDEXER_ENABLED=false
    networks:
      internal:
      db:
      edge:
    profiles:
      - affine
      - services
      
  affine_migration:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine_migration_job
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME_AFFINE}:${DB_PASSWORD_AFFINE}@${DB_NAME}:5432/affine
      - AFFINE_INDEXER_ENABLED=false
    networks:
      internal:
      db:
    profiles:
      - affine
      - services
