services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    conatiner_name: affine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      - ${AFFINE_UPLOAD_LOCATION}:/root/.affine/storage
      - ${AFFINE_CONFIG_LOCATION}:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME_AFFINE}:${DB_USERNAME_PASSWORD}@${DB_NAME}:5432/affine
      - AFFINE_INDEXER_ENABLED=false
    profiles:
      - affine
      
  affine_migration:
    image: ghcr.io/toeverything/affine:stable
    conatiner_name: affine_migration_job
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    volumes:
      - ${AFFINE_UPLOAD_LOCATION}:/root/.affine/storage
      - ${AFFINE_CONFIG_LOCATION}:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME_AFFINE}:${DB_USERNAME_PASSWORD}@${DB_NAME}:5432/affine
      - AFFINE_INDEXER_ENABLED=false
    profiles:
      - affine
