services:
  commafeed:
    image: athou/commafeed:latest-postgresql
    container_name: commafeed
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://database:5432/commafeed
      QUARKUS_DATASOURCE_USERNAME: commafeed
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD_COMMAFEED}
    depends_on:
      - database
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      db:
      edge:
    profiles:
      - commafeed
      - services

