services:
  commafeed:
    image: athou/commafeed:latest-postgresql
    container_name: commafeed
    restart: unless-stopped
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://database:5432/commafeed
      - QUARKUS_DATASOURCE_USERNAME: commafeed
      - QUARKUS_DATASOURCE_PASSWORD: *db-password
    deploy:
      resources:
        limits:
          memort: 256M
    networks:
      local:

